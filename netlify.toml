[build]
  base      = "junte"
  publish   = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[[redirects]]
  from = "/live"
  to   = "/live.html"
  status = 200

[[redirects]]
  from = "/cuenta"
  to   = "/cuenta.html"
  status = 200

[[redirects]]
  from = "/admin"
  to   = "/admin.html"
  status = 200
